spring:
  application:
    name: product-catalog
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scale_10k}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:YOUR_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
